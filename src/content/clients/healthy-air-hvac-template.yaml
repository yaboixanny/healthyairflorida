# ── 1. Business Info ─────────────────────────────────────
businessName: "HealthyAirFL"
phone: "(239) 270-0809"
address: "123 Main Street"
city: "Naples"
state: "FL"
zip: "34102"
email: "info@healthyairfl.com"
siteUrl: "https://healthyairfl.com"

yearFounded: 2010
schemaDescription: "HealthyAirFL is a trusted HVAC company serving Naples, FL with fast, reliable heating and cooling services."

# ── 2. Brand ─────────────────────────────────────────────
# Primary brand color (used in header, buttons, hero overlay)
