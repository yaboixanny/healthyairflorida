navCtaUrl: "/contact"

# ── 4. Images ────────────────────────────────────────────
# Drop all images into: public/_assets/
# Then fill in the filenames below.
truckSrc: "/_assets/TRUCK-IMAGE.png"
techCutout: "/_assets/TECH-CUTOUT.webp"
logoSrc: "/_assets/healthyairfllogo.png"
# For the service area Google Map — get embed URL from:
# Google Maps → Share → Embed a map → copy src="" URL
mapEmbedUrl: "https://www.google.com/maps/embed?pb=..."

# ── Team ─────────────────────────────────────────────────
team:
  - name: "Nick"
    role: "HVAC Technician"
    blurb: "Nick handles diagnostics, repairs, and maintenance with a strong focus on clear communication and dependable service."
    image: "/_assets/nickhealthyair.jpeg"
  - name: "HealthyAirFL Team"
    role: "Owner"
    blurb: "Locally owned and operated in Naples, our leadership team is committed to honest service, quality workmanship, and fast response times."
    image: "/_assets/healthyairteam.jpeg"
  - name: "Ricardo"
    role: "HVAC Installer"
    blurb: "Ricardo leads installations with precision and care, making sure every system is set up for long-term performance."
    image: "/_assets/ricardohealthyair.jpeg"

